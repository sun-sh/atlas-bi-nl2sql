name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_BGE: "false"
      LLM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Seed deterministic dataset
        run: python -m app.nl2sql.seed
      - name: Run tests
        run: python -m pytest -q
      - name: Run golden evaluation
        run: python -m app.evaluation.run
