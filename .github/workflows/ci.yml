name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      USE_BGE: "false"
      LLM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify runtime import
        run: python -c "from app.api.main import app; print(app.title)"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Seed deterministic database
        run: python -m app.nl2sql.seed
      - name: Run self-contained tests
        run: python -m pytest -q
      - name: Run model evaluation smoke check
        run: python -m app.evaluation.run
      - name: Run scope guard evaluation
        run: python -m app.evaluation.run --suite scope --min-hit-rate 100
      - name: Run rule-equivalence evaluation
        run: python -m app.evaluation.run --suite rules --min-hit-rate 100
      - name: Run retrieval ablation gate
        run: python -m app.evaluation.run --suite retrieval --min-hit-rate 100
      - name: Run natural-language end-to-end gate
        run: python -m app.evaluation.run --suite natural --min-hit-rate 100
