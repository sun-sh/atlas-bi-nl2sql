name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      USE_BGE: "false"
      LLM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify runtime import
        run: python -c "from app.api.main import app; print(app.title)"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run self-contained tests
        run: python -m pytest -q
      - name: Run self-contained golden evaluation
        run: python -m app.evaluation.run
